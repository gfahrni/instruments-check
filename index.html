<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Instruments">
<meta name="theme-color" content="#000000">
<title>Mes instruments 🎵</title>
<link rel="stylesheet" href="instruments-v2.css">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  #entete {
    height: calc(44px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    padding-left: 16px; padding-right: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #000; font-weight: 700; font-size: 1.05rem;
  }
  #entete .jour { font-weight: 400; opacity: .7; font-size: .9rem; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layout { display: flex; height: calc(100vh - 44px - env(safe-area-inset-top)); height: calc(100dvh - 44px - env(safe-area-inset-top)); }
  /* Panneaux swipeables : chaque colonne defile verticalement, un panneau par ecran. */
  .col { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: y mandatory; }
  .col + .col { border-left: 3px solid #000; }
  .case {
    min-height: 100%; scroll-snap-align: start; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; text-align: center;
  }
  .inst-emoji { font-size: 3.6rem; line-height: 1; }
  .case.star-case h2 { font-size: 2.1rem; margin: 0; }
  .case.star-case .qui { margin: 0; opacity: .85; font-size: 1rem; }
  .case button {
    font: inherit; font-weight: 700; font-size: 1.3rem;
    min-height: 64px; min-width: 170px; padding: 14px 26px;
    border-radius: 16px; border: 0; touch-action: manipulation;
  }
  .case button:active { transform: scale(.95); }
  .case button.restart {
    font-size: 1rem; font-weight: 600; min-height: 48px; min-width: 0; padding: 10px 18px;
    border-radius: 12px; background: rgba(0, 0, 0, .28); color: inherit;
    border: 2px solid currentColor; opacity: .8; margin-top: 8px;
  }
  .case.star-case .star { font-size: 4rem; line-height: 1; }
  .case.star-case .star.won { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  /* Panneau 2 : cadeau / carte */
  .case.bonus-case { background: #f4f4f2; color: #333; }
  .case.bonus-case img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    display: block; border-radius: 10px; box-shadow: 0 5px 16px rgba(0, 0, 0, .35);
  }
  .case.bonus-case .lock { font-size: 1.5rem; line-height: 1.7; opacity: .5; }
</style>
</head>
<body>
<header id="entete">
  <span>🎵 Mes instruments</span>
  <span class="jour" id="jour"></span>
</header>
<main class="layout">
  <section class="col" id="col-edwin"></section>
  <section class="col" id="col-ambre"></section>
</main>
<script>
// Deux enfants, chacun son instrument. "mario" = Edwin, "peach" = Ambre.
var KIDS = [
  { id: 'edwin', theme: 'mario', nom: 'Edwin', instrument: 'Piano', emoji: '🎹' },
  { id: 'ambre', theme: 'peach', nom: 'Ambre', instrument: 'Violon', emoji: '🎻' }
];
var LS = 'instruments-v1-';
var DATA = null;
var mem = {};

function el(tag, cls, text) {
  var d = document.createElement(tag);
  if (cls) { d.className = cls; }
  if (text) { d.textContent = text; }
  return d;
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
function clearAll() {
  try {
    var rm = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(LS) === 0) { rm.push(k); }
    }
    for (var j = 0; j < rm.length; j++) { localStorage.removeItem(rm[j]); }
  } catch (e) {}
  mem = {};
}
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
// Reset quotidien : a chaque nouveau jour, tout repart a zero (mission, etoile, cadeau, carte).
function resetIfNewDay() {
  var t = todayKey();
  var prev = lsGet(LS + 'day');
  var changed = !!prev && prev !== t;
  if (changed) { clearAll(); }
  lsSet(LS + 'day', t);
  return changed;
}
function isFait(id) { return lsGet(LS + 'fait-' + id) === '1'; }
function isBonus(id) { return lsGet(LS + 'bonus-' + id) === '1'; }
function setFait(id) { lsSet(LS + 'fait-' + id, '1'); }
function setBonus(id) { lsSet(LS + 'bonus-' + id, '1'); }
// Recommencer : efface mission + cadeau pour cet enfant. NE touche PAS a la carte du jour.
function clearKid(id) { lsDel(LS + 'fait-' + id); lsDel(LS + 'bonus-' + id); }

function hashStr(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Charge (et decode) une image hors DOM, puis rappelle cb avec l'Image (ou null si echec).
// Evite le bug de repaint iOS Safari : inserer + scroller une <img> non decodee laisse une tuile blanche.
var imgCache = {};
function withImage(src, cb) {
  var cached = imgCache[src];
  if (cached) { cb(cached); return; }
  var im = new Image();
  function done() { imgCache[src] = im; cb(im); }
  im.onload = function () { if (im.decode) { im.decode().then(done, done); } else { done(); } };
  im.onerror = function () { cb(null); };
  im.src = src;
}
// Carte du jour : selection stable toute la journee (stockee), change uniquement le lendemain.
function cardFor(id) {
  if (!DATA || !DATA[id] || !DATA[id].cartes || !DATA[id].cartes.length) { return null; }
  var set = DATA[id].cartes;
  var saved = lsGet(LS + 'carte-' + id);
  if (saved) {
    for (var i = 0; i < set.length; i++) { if (set[i].id === saved) { return set[i]; } }
  }
  var card = set[hashStr(todayKey() + '|' + id) % set.length];
  lsSet(LS + 'carte-' + id, card.id);
  return card;
}

function restartBtn(kid) {
  var r = el('button', 'restart', '↺ Recommencer');
  r.onclick = function () {
    clearKid(kid.id);
    renderStar(kid);
    renderBonus(kid);
    var col = document.getElementById('col-' + kid.id);
    if (col) { col.scrollTop = 0; }
  };
  return r;
}
function renderStar(kid) {
  var p = document.getElementById('star-' + kid.id);
  if (!p) { return; }
  p.innerHTML = '';
  if (!isFait(kid.id)) {
    p.appendChild(el('div', 'inst-emoji', kid.emoji));
    p.appendChild(el('h2', null, kid.instrument));
    p.appendChild(el('p', 'qui', kid.nom + ' • Mission du jour'));
    var b = el('button', 'fait', 'Fait 👆');
    b.onclick = function () {
      setFait(kid.id);
      renderStar(kid);
    };
    p.appendChild(b);
  } else {
    p.appendChild(el('div', 'star won', '⭐'));
    p.appendChild(el('h2', null, 'Bravo ' + kid.nom + ' !'));
    if (isBonus(kid.id)) {
      p.appendChild(el('p', 'qui', 'Cadeau débloqué ✅'));
    } else {
      var bb = el('button', 'bonus', '🎁 Cadeau Bonus');
      bb.onclick = function () {
        if (confirm('As tu bien fait ton instrument ?')) {
          setBonus(kid.id);
          renderStar(kid);
          renderBonus(kid, function () { tpBonus(kid.id); });
        }
      };
      p.appendChild(bb);
    }
  }
  p.appendChild(restartBtn(kid));
}
function renderBonus(kid, after) {
  var c = document.getElementById('bonus-' + kid.id);
  if (!c) { if (after) { after(); } return; }
  c.innerHTML = '';
  if (!isBonus(kid.id)) {
    var lock = el('div', 'lock');
    lock.appendChild(el('div', null, '🔒'));
    lock.appendChild(el('div', null, 'Cadeau Bonus'));
    c.appendChild(lock);
    if (after) { after(); }
    return;
  }
  var card = cardFor(kid.id);
  if (!card) {
    c.appendChild(el('p', 'lock', 'Oups, carte introuvable 😢'));
    if (after) { after(); }
    return;
  }
  // On attend le decodage complet AVANT d'inserer la <img> et de scroller (voir withImage).
  withImage(card.img, function (im) {
    if (!isBonus(kid.id)) { return; }
    c.innerHTML = '';
    var img = document.createElement('img');
    img.alt = '';
    if (im) { img.width = im.naturalWidth; img.height = im.naturalHeight; }
    img.src = card.img;
    c.appendChild(img);
    if (after) { after(); }
  });
}
// TP vers le panneau 2 (cadeau) apres deblocage.
function tpBonus(id) {
  var col = document.getElementById('col-' + id);
  var c = document.getElementById('bonus-' + id);
  if (!col || !c) { return; }
  col.scrollTop += c.getBoundingClientRect().top - col.getBoundingClientRect().top;
}
function buildKid(kid) {
  var col = document.getElementById('col-' + kid.id);
  if (!col) { return; }
  col.className = 'col ' + kid.theme;
  col.innerHTML = '';
  var s = el('div', 'case star-case');
  s.id = 'star-' + kid.id;
  col.appendChild(s);
  var c = el('div', 'case bonus-case');
  c.id = 'bonus-' + kid.id;
  col.appendChild(c);
  renderStar(kid);
  renderBonus(kid);
  // Precharge la carte du jour : deja decodee quand le Cadeau Bonus est confirme.
  var card = cardFor(kid.id);
  if (card) { withImage(card.img, function () {}); }
}
function renderJour() {
  var e = document.getElementById('jour');
  if (!e) { return; }
  try {
    e.textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (err) { e.textContent = ''; }
}
function buildAll() {
  for (var i = 0; i < KIDS.length; i++) { buildKid(KIDS[i]); }
  renderJour();
}
function onResume() {
  if (resetIfNewDay()) { buildAll(); }
  renderJour();
}
resetIfNewDay();
if (window.fetch) {
  fetch('cartes.json').then(function (r) {
    if (!r.ok) { throw new Error('http ' + r.status); }
    return r.json();
  }).then(function (d) {
    DATA = d;
    buildAll();
  }).catch(function () {
    buildAll();
  });
} else {
  buildAll();
}
if (document.addEventListener) {
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { onResume(); } });
}
window.addEventListener('pageshow', onResume);
</script>
</body>
</html>
