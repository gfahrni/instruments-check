<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Instruments">
<meta name="theme-color" content="#000000">
<title>Mes instruments 🎵</title>
<link rel="stylesheet" href="instruments-v1.css">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  #entete {
    height: calc(44px + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    padding-left: 16px; padding-right: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #000; font-weight: 700; font-size: 1.05rem;
  }
  #entete .jour { font-weight: 400; opacity: .7; font-size: .9rem; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #app { display: flex; height: calc(100vh - 44px - env(safe-area-inset-top)); height: calc(100dvh - 44px - env(safe-area-inset-top)); }
  .kid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .kid + .kid { border-left: 3px solid #000; }
  .panel {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; text-align: center;
  }
  .panel.mission + .panel { border-top: 3px solid #000; }
  .inst-emoji { font-size: 3.6rem; line-height: 1; }
  .panel.mission h2 { font-size: 2.1rem; margin: 0; }
  .panel.mission .qui { margin: 0; opacity: .85; font-size: 1rem; }
  .panel button {
    font: inherit; font-weight: 700; font-size: 1.3rem;
    min-height: 64px; min-width: 170px; padding: 14px 26px;
    border-radius: 16px; border: 0; touch-action: manipulation;
  }
  .panel button:active { transform: scale(.95); }
  .star { font-size: 4rem; line-height: 1; }
  .star.won { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .panel.carte { background: #f4f4f2; color: #333; }
  .panel.carte img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    display: block; border-radius: 10px; box-shadow: 0 5px 16px rgba(0, 0, 0, .35);
  }
  .panel.carte .lock { font-size: 1.5rem; line-height: 1.7; opacity: .5; }
</style>
</head>
<body>
<header id="entete">
  <span>🎵 Mes instruments</span>
  <span class="jour" id="jour"></span>
</header>
<main id="app">
  <section class="kid" id="kid-edwin"></section>
  <section class="kid" id="kid-ambre"></section>
</main>
<script>
// Deux enfants, chacun son instrument. "mario" = Edwin, "peach" = Ambre.
var KIDS = [
  { id: 'edwin', theme: 'mario', nom: 'Edwin', instrument: 'Piano', emoji: '🎹' },
  { id: 'ambre', theme: 'peach', nom: 'Ambre', instrument: 'Violon', emoji: '🎻' }
];
var LS = 'instruments-v1-';
var DATA = null;
var mem = {};

function el(tag, cls, text) {
  var d = document.createElement(tag);
  if (cls) { d.className = cls; }
  if (text) { d.textContent = text; }
  return d;
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
function clearAll() {
  try {
    var rm = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(LS) === 0) { rm.push(k); }
    }
    for (var j = 0; j < rm.length; j++) { localStorage.removeItem(rm[j]); }
  } catch (e) {}
  mem = {};
}
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
// Reset quotidien : a chaque nouveau jour, tout repart a zero (mission, etoile, cadeau, carte).
function resetIfNewDay() {
  var t = todayKey();
  var prev = lsGet(LS + 'day');
  var changed = !!prev && prev !== t;
  if (changed) { clearAll(); }
  lsSet(LS + 'day', t);
  return changed;
}
function isFait(id) { return lsGet(LS + 'fait-' + id) === '1'; }
function isBonus(id) { return lsGet(LS + 'bonus-' + id) === '1'; }
function setFait(id) { lsSet(LS + 'fait-' + id, '1'); }
function setBonus(id) { lsSet(LS + 'bonus-' + id, '1'); }

function hashStr(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Carte aleatoire mais stable sur la journee : hash(date|enfant) -> meme carte toute la journee.
function cardFor(id) {
  if (!DATA || !DATA[id] || !DATA[id].cartes || !DATA[id].cartes.length) { return null; }
  var set = DATA[id].cartes;
  return set[hashStr(todayKey() + '|' + id) % set.length];
}

function renderMission(kid) {
  var p = document.getElementById('mission-' + kid.id);
  if (!p) { return; }
  p.innerHTML = '';
  if (!isFait(kid.id)) {
    p.appendChild(el('div', 'inst-emoji', kid.emoji));
    p.appendChild(el('h2', null, kid.instrument));
    p.appendChild(el('p', 'qui', kid.nom + ' • Mission du jour'));
    var b = el('button', 'fait', 'Fait 👆');
    b.onclick = function () {
      setFait(kid.id);
      renderMission(kid);
      renderCarte(kid);
    };
    p.appendChild(b);
  } else {
    p.appendChild(el('div', 'star won', '⭐'));
    p.appendChild(el('h2', null, 'Bravo ' + kid.nom + ' !'));
    if (isBonus(kid.id)) {
      p.appendChild(el('p', 'qui', 'Cadeau débloqué ✅'));
    } else {
      var bb = el('button', 'bonus', '🎁 Cadeau Bonus');
      bb.onclick = function () {
        if (confirm('As tu bien fait ton instrument ?')) {
          setBonus(kid.id);
          renderMission(kid);
          renderCarte(kid);
        }
      };
      p.appendChild(bb);
    }
  }
}
function renderCarte(kid) {
  var c = document.getElementById('carte-' + kid.id);
  if (!c) { return; }
  c.innerHTML = '';
  if (!isBonus(kid.id)) {
    c.className = 'panel carte';
    var lock = el('div', 'lock');
    lock.appendChild(el('div', null, '🔒'));
    lock.appendChild(el('div', null, 'Cadeau Bonus'));
    c.appendChild(lock);
    return;
  }
  c.className = 'panel carte';
  var card = cardFor(kid.id);
  if (!card) {
    c.appendChild(el('p', 'lock', 'Oups, carte introuvable 😢'));
    return;
  }
  var img = document.createElement('img');
  img.src = card.img;
  img.alt = '';
  c.appendChild(img);
}
function buildKid(kid) {
  var col = document.getElementById('kid-' + kid.id);
  if (!col) { return; }
  col.innerHTML = '';
  var m = el('div', 'panel mission ' + kid.theme);
  m.id = 'mission-' + kid.id;
  col.appendChild(m);
  var c = el('div', 'panel carte');
  c.id = 'carte-' + kid.id;
  col.appendChild(c);
  renderMission(kid);
  renderCarte(kid);
}
function renderJour() {
  var e = document.getElementById('jour');
  if (!e) { return; }
  try {
    e.textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (err) { e.textContent = ''; }
}
function buildAll() {
  for (var i = 0; i < KIDS.length; i++) { buildKid(KIDS[i]); }
  renderJour();
}
function onResume() {
  if (resetIfNewDay()) { buildAll(); }
  renderJour();
}
resetIfNewDay();
if (window.fetch) {
  fetch('cartes.json').then(function (r) {
    if (!r.ok) { throw new Error('http ' + r.status); }
    return r.json();
  }).then(function (d) {
    DATA = d;
    buildAll();
  }).catch(function () {
    buildAll();
  });
} else {
  buildAll();
}
if (document.addEventListener) {
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { onResume(); } });
}
window.addEventListener('pageshow', onResume);
</script>
</body>
</html>
